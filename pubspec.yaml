name: easypos
description: Lightweight offline mobile point of sale by HamdhyTech.
publish_to: "none"
version: 1.4.0+4

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  mobile_scanner: ^7.0.1
  barcode_widget: ^2.0.4
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  local_auth: ^2.3.0
  http: ^1.4.0
  uuid: ^4.5.1
  csv: ^6.0.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The 2.3.x Android implementation currently pulls a JNI Gradle script that
# is incompatible with Flutter's generated Android plugin configuration.
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
  assets:
    - assets/images/easypos_logo.png
